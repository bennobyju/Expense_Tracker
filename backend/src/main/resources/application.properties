spring.application.name=backend

# Server Port
server.port=8080

# MariaDB Database Connection
spring.datasource.url=jdbc:mariadb://localhost:3306/expense_tracker
spring.datasource.username=root
spring.datasource.password="password"
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. Show the real values bound to the '?' placeholders in SQL queries
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# 2. Output detailed Spring Web MVC controller request mapping logs
logging.level.org.springframework.web=INFO
# 3. Save logs to a local file in your project folder
logging.file.name=logs/expense-tracker.log